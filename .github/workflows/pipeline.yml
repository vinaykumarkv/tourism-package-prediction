name: Tourism Project Pipeline

on:
  push:
    branches:
      - main               # automatically runs on every push to main
  workflow_dispatch:        # lets you click "Run workflow" in the Actions tab

permissions:
  contents: write           # the training job commits the trained model back to the repo

# If several pushes arrive together, only the newest run continues
concurrency:
  group: tourism-pipeline
  cancel-in-progress: true

jobs:

  # ---------- JOB 1: Register the dataset ----------
  register-dataset:
    name: Register Dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Register Dataset
        run: python tourism_project/model_building/data_register.py
      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: tourism_project/data/tourism.csv

  # ---------- JOB 2: Clean the data and create train/test splits ----------
  data-prep:
    name: Data Preparation
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Run Data Preparation
        run: python tourism_project/model_building/prep.py
      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv

  # ---------- JOB 3: Tune + track the model with MLflow, commit the best model ----------
  model-training:
    name: Model Training
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Dependencies
        run: pip install -r tourism_project/requirements.txt
      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits
      - name: Start MLflow Server
        run: |
          nohup mlflow ui --host 0.0.0.0 --port 5000 > mlflow_server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:5000/health && break
            sleep 2
          done
      - name: Model Building
        run: python tourism_project/model_building/train.py
      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tourism_project/deployment/tourism_package_model_v1.joblib
          git commit -m "Add trained model [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main

  # ---------- JOB 4: Check that the committed model is ready to be served ----------
  deployment-check:
    name: Deployment Check
    needs: model-training
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main                # pick up the model commit made by the previous job
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install App Dependencies
        run: pip install -r tourism_project/deployment/requirements.txt
      - name: Smoke Test Model
        run: python tourism_project/model_building/smoke_test.py
